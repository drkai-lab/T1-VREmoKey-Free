name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: linux (lint, tests, tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tooling
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python3 tests/test_hotkeys.py
      - name: CLI smoke test
        run: |
          python3 vrc-expression-hotkeys.py --version
          python3 vrc-expression-hotkeys.py --help > /dev/null
      - name: Tarball
        id: tarball
        run: |
          ./build-release.sh
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' vrc-expression-hotkeys.py)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: |
            dist/vrc-expression-hotkeys-linux-${{ steps.tarball.outputs.version }}.tar.gz
            dist/vrc-expression-hotkeys-linux-${{ steps.tarball.outputs.version }}.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: windows (.exe + installer)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python3 tests/test_hotkeys.py
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build console exe
        run: pyinstaller --noconfirm windows/vrc-expression-hotkeys.spec
      - name: Build windowed exe
        run: pyinstaller --noconfirm windows/vrc-expression-hotkeys-gui.spec
      - name: Launch smoke test
        run: |
          ./dist-win/vrc-expression-hotkeys.exe --version
          ./dist-win/vrc-expression-hotkeys.exe --help > /dev/null
          ./dist-win/vrc-expression-hotkeys-gui.exe --version
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        run: iscc windows/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist-win/*.exe
          if-no-files-found: error

  rust:
    name: rust (fmt, clippy, tests, packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        working-directory: rust
        run: cargo fmt --check
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --all-targets
      - name: Release build
        working-directory: rust
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
        run: cargo build --release
      - name: Smoke
        working-directory: rust
        run: |
          ./target/release/vrc-expression-hotkeys --version
          ./target/release/vrc-expression-hotkeys --help > /dev/null
          ./target/release/vrc-expression-hotkeys-gui --version
      - name: Packages
        working-directory: rust
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build
          ./packaging/build-tarball.sh
          ./packaging/build-pkg.sh
          cp target/debian/*.deb ../dist/
      - name: Unity package
        run: python3 scripts/pack-unity.py
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux
          path: dist/**
          if-no-files-found: error

  rust-windows:
    name: rust windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        working-directory: rust
        run: cargo test --all-targets
      - name: Release build
        working-directory: rust
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src
        run: cargo build --release
      - name: Smoke
        working-directory: rust
        run: |
          ./target/release/vrc-expression-hotkeys.exe --version
          ./target/release/vrc-expression-hotkeys.exe --help > $null
          ./target/release/vrc-expression-hotkeys-gui.exe --version
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer
        run: iscc rust/packaging/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: rust-windows-x64
          path: dist-win-rust/**
          if-no-files-found: error

  release:
    name: attach binaries to the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, rust, rust-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes out/*
